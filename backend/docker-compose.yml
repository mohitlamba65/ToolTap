services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tooltap-postgres
    restart: always
    environment:
      POSTGRES_USER: tooltap
      POSTGRES_PASSWORD: tooltap_secret
      POSTGRES_DB: tooltap
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooltap -d tooltap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
